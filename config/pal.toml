# Pal runtime configuration.
#
# Installed in the VM at ~/.config/pal/pal.toml. Every key is optional; the
# values below are the defaults.

[model]
# Default model and effort for every bot. Individual bots can override these
# in bots/<id>.toml, and both can be changed at runtime from the app.
default = "claude-sonnet-5-5"
effort = "high"          # low | medium | high | xhigh | max

[paths]
workspaces = "~/workspaces"      # each bot's main folder lives here
data = "~/.local/share/pal"      # memory, conversations, runtime state

[agent]
permission_mode = "bypassPermissions"   # the VM is the bots' own computer
thinking_display = "summarized"          # summarized | omitted

[displays]
backend = "systemd"
idle_timeout_seconds = 480       # a display sleeps after 8 idle minutes
check_interval_seconds = 15
geometry = "1280x800"             # what the bots see in screenshots
depth = 24
operator_display = 1             # your remote-control display, :1
browser_display = 2              # the shared browser, :2
first_bot_display = 10           # bots get :10, :11, ...
vnc_internal_base_port = 15900   # Xvnc on localhost
vnc_public_base_port = 5900      # proxied for viewers (5901 = :1, 5910 = :10)
vnc_bind_host = "127.0.0.1"   # reached from the Mac through palvmd

[api]
host = "127.0.0.1"               # reached from the Mac through palvmd
port = 8765

[messaging]
reply_timeout_seconds = 600      # how long a bot waits for another bot's answer
max_chain_depth = 4              # how many bots can be waiting on each other

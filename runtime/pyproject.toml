[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pal-runtime"
version = "0.1.0"
description = "Pal runtime: a team of agent bots sharing a computer, memory, and conversations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.2.179",
  "aiohttp>=3.10",
  "pyyaml>=6.0",
  "pillow>=11.0",
  "playwright>=1.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
pal = "pal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF012"]
